AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Prototipo HLF (hackatón AWS Breaking Barriers 2026). Lambda que recalcula la prioridad de un
  paciente cuando llega un evento clínico (EventBridge o API HTTP) y Lambda que cada mañana carga el
  reporte del día desde S3 y deja el resumen de cambios.

Parameters:
  BedrockModelId:
    Type: String
    Default: ""
    Description: >-
      Id del modelo o inference profile de Bedrock habilitado en la cuenta, para redactar explicaciones.
      Vacío = se usa la explicación de respaldo (plantilla).

Resources:
  RecalculoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 1024
      Timeout: 30
      Architectures:
        - x86_64
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        EventoClinico:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - hlf.registro-clinico
              detail-type:
                - EventoClinico
        ApiEvento:
          Type: HttpApi
          Properties:
            Path: /evento
            Method: post
    Metadata:
      Dockerfile: infra/Dockerfile.lambda
      DockerContext: ..
      DockerTag: v1

  ReportesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CargaDiariaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - api.diario.lambda_handler
      MemorySize: 1024
      Timeout: 300
      Architectures:
        - x86_64
      Environment:
        Variables:
          BUCKET: !Ref ReportesBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ReportesBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        CadaManana:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 7 ? * MON-FRI *)
            ScheduleExpressionTimezone: America/Santiago
    Metadata:
      Dockerfile: infra/Dockerfile.lambda
      DockerContext: ..
      DockerTag: v1

Outputs:
  UrlApi:
    Description: Endpoint para registrar un evento (POST con el JSON de api/handler.py)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/evento"
  Funcion:
    Description: Nombre de la Lambda de recálculo
    Value: !Ref RecalculoFunction
  BucketReportes:
    Description: Subir cada reporte a s3://<bucket>/reportes/AAAA-MM-DD/ ; el resumen queda en salidas/
    Value: !Ref ReportesBucket
